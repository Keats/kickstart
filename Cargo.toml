[package]
authors = ["Vincent Prouillet <hello@vincentprouillet.com>"]
description = "A simple way to get started with a project by scaffolding from a template powered by the Tera engine"
edition = "2024"
keywords = ["boilerplate", "generator", "scaffolding", "templating", "tera"]
license = "MIT"
name = "kickstart"
version = "0.7.0"

[[bin]]
name = "kickstart"
required-features = ["cli"]

[dependencies]
glob = "0.3"
heck = "0.5"
memchr = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
tera = { version = "2", features = ["fast"] }
tera-contrib = { version = "0.3", features = ["date", "slug"] }
toml = "0.9"
walkdir = "2"

anyhow = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
term = { version = "1", optional = true }

[dev-dependencies]
insta = { version = "1.38.0", features = ["glob"] }

[badges]
maintenance = { status = "actively-developed" }

[features]
cli = ["dep:anyhow", "dep:clap", "dep:serde_json", "dep:term"]
required-features = ["cli"]

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
